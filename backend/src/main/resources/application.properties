spring.application.name=web

server.port=8080

# MySQL
# 沒有預設值是刻意的：少設一個環境變數就該啟動失敗，
# 而不是安靜地用弱密碼連上資料庫。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gpt_chat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# 正式環境請設 DDL_AUTO=validate 並改用 Flyway 管 schema
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# show-sql 會把使用者的完整對話內容印進 log，預設關閉
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# OpenAI
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.api-url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.connect-timeout-seconds=${OPENAI_CONNECT_TIMEOUT:10}
openai.read-timeout-seconds=${OPENAI_READ_TIMEOUT:60}

# Chat
# 送給模型的歷史視窗：最多幾則、總字元上限
chat.history-limit=${CHAT_HISTORY_LIMIT:20}
chat.history-max-chars=${CHAT_HISTORY_MAX_CHARS:12000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
